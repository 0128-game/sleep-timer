<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>爆音仮眠アラーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: single centered column — big clock, time picker, quick-nap chips, one arm button. Night-mode single dark theme by design. */
:root{
  --bg:#0d0f14; --panel:#161a22; --line:#262c38; --fg:#e7e9ee; --dim:#7d8597;
  --accent:#ffb020; --danger:#ff2a2a;
  --mono:"Azeret Mono",ui-monospace,Menlo,monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.now{font-family:var(--mono);font-weight:300;font-size:clamp(56px,18vw,96px);text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.now small{display:block;font-family:var(--sans);font-size:13px;color:var(--dim);letter-spacing:.12em;margin-bottom:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
label.lbl{font-size:12px;color:var(--dim);letter-spacing:.12em}
#time{font-family:var(--mono);font-size:40px;font-weight:600;background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;box-sizing:border-box;text-align:center}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{font-family:var(--mono);font-size:15px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:10px 0;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.big{font-family:var(--sans);font-weight:700;font-size:20px;border:none;border-radius:12px;padding:18px;cursor:pointer;background:var(--accent);color:#1a1200}
.big:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-size:14px;padding:12px;border-radius:10px;cursor:pointer;font-family:var(--sans)}
.row{display:flex;gap:8px}.row>*{flex:1}
.armed{text-align:center;display:flex;flex-direction:column;gap:6px}
.armed .t{font-family:var(--mono);font-size:22px;color:var(--accent)}
.armed .cd{font-family:var(--mono);font-size:clamp(40px,13vw,64px);font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--dim);line-height:1.7}
.note b{color:var(--fg);font-weight:700}
/* ringing overlay */
#ring{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--danger);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));animation:flash .25s steps(1) infinite}
#ring h1{font-size:clamp(48px,16vw,110px);margin:0;color:#fff;font-family:var(--mono);letter-spacing:-.03em}
#ring button{width:min(360px,100%)}
#stop{background:#fff;color:#000;font-size:28px;padding:26px}
#snooze{background:rgba(0,0,0,.35);color:#fff}
@keyframes flash{50%{background:#fff}50%{}}
#ring.a h1{animation:flashT .25s steps(1) infinite}
@keyframes flashT{50%{color:var(--danger)}}
@media (prefers-reduced-motion:reduce){#ring,#ring.a h1{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="now"><small>現在時刻</small><span id="clock">--:--:--</span></div>

  <section class="panel" id="setup">
    <label class="lbl" for="time">起きる時刻</label>
    <input type="time" id="time" value="13:20">
    <label class="lbl">今から仮眠（分）</label>
    <div class="chips">
      <button class="chip" data-m="10">+10</button>
      <button class="chip" data-m="15">+15</button>
      <button class="chip" data-m="20">+20</button>
      <button class="chip" data-m="25">+25</button>
      <button class="chip" data-m="30">+30</button>
      <button class="chip" data-m="90">+90</button>
    </div>
    <button class="big" id="arm">アラームをセット</button>
    <div class="row"><button class="ghost" id="test">音量テスト（1秒）</button></div>
  </section>

  <section class="panel armed" id="armedBox" hidden>
    <div class="lbl">アラーム</div>
    <div class="t" id="armedAt">--:--</div>
    <div class="cd" id="cd">--:--</div>
    <button class="ghost" id="cancel">取り消す</button>
  </section>

  <p class="note">
    <b>端末の音量を最大</b>にしてからセットしてください。音はページ側で出せる最大レベル（約3kHzの割れたサイレン）ですが、端末の音量より大きくはできません。<br>
    セット後は<b>このタブを開いたまま</b>にしてください。画面スリープは自動で防ぎます。iPhoneはマナースイッチがオンだと鳴らないことがあります。
  </p>
</div>

<div id="ring" hidden>
  <h1>起きろ</h1>
  <button class="big" id="stop">止める</button>
  <button class="big" id="snooze">5分スヌーズ</button>
</div>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
let ctx=null, alarm=null, target=null, wake=null, timer=null;

function now(){return new Date()}
function fmt(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
// default time: now + 20 min
(()=>{const d=new Date(Date.now()+20*60000);$('time').value=fmt(d)})();

function getCtx(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();}
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}

// Build the siren graph; it starts at audio-clock time `when` (immune to background timer throttling)
function buildAlarm(when, dur){
  const c=getCtx();
  const out=c.createGain(); out.gain.value=1;
  // hard clipper for maximum loudness
  const shaper=c.createWaveShaper();
  const curve=new Float32Array(1024);
  for(let i=0;i<1024;i++){const x=i/511.5-1;curve[i]=Math.max(-1,Math.min(1,x*6));}
  shaper.curve=curve;
  const pre=c.createGain(); pre.gain.value=1;
  // beep gate: 0..1 square at 4Hz
  const gate=c.createGain(); gate.gain.value=0.5;
  const gLfo=c.createOscillator(); gLfo.type='square'; gLfo.frequency.value=4;
  const gAmt=c.createGain(); gAmt.gain.value=0.5; gLfo.connect(gAmt).connect(gate.gain);
  // two detuned square tones near 3kHz with a warble
  const oscs=[];
  const wLfo=c.createOscillator(); wLfo.type='triangle'; wLfo.frequency.value=12;
  const wAmt=c.createGain(); wAmt.gain.value=450; wLfo.connect(wAmt);
  [2900,3350,1450].forEach((f,i)=>{
    const o=c.createOscillator(); o.type=i===2?'sawtooth':'square'; o.frequency.value=f;
    wAmt.connect(o.frequency);
    const g=c.createGain(); g.gain.value=i===2?.5:.7;
    o.connect(g).connect(pre); oscs.push(o);
  });
  pre.connect(gate).connect(shaper).connect(out).connect(c.destination);
  const all=[...oscs,gLfo,wLfo];
  all.forEach(o=>{o.start(when); if(dur)o.stop(when+dur);});
  return {stop(){all.forEach(o=>{try{o.stop()}catch(e){}});try{out.disconnect()}catch(e){}}};
}

async function lockScreen(){
  try{ if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');} }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(target&&document.visibilityState==='visible')lockScreen();});

function arm(t){
  target=t;
  if(alarm)alarm.stop();
  const c=getCtx();
  // keep the context alive with an inaudible constant tone
  if(!ctx._keep){const k=c.createOscillator(),g=c.createGain();g.gain.value=0.0001;k.connect(g).connect(c.destination);k.start();ctx._keep=k;}
  const delay=Math.max(0,(t-Date.now())/1000);
  alarm=buildAlarm(c.currentTime+delay);
  lockScreen();
  $('setup').hidden=true; $('armedBox').hidden=false;
  $('armedAt').textContent=fmt(t)+' に鳴ります';
  tick();
}

function disarm(){
  target=null; if(alarm){alarm.stop();alarm=null;}
  $('ring').hidden=true; $('setup').hidden=false; $('armedBox').hidden=true;
  try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
  if(wake){wake.release().catch(()=>{});wake=null;}
}

function tick(){
  const n=now();
  $('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  if(target){
    const left=Math.max(0,Math.ceil((target-n)/1000));
    const h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60;
    $('cd').textContent=(h?h+':'+pad(m):pad(m))+':'+pad(s);
    if(left<=0&&$('ring').hidden){
      $('ring').hidden=false; $('ring').classList.add('a');
      if(ctx&&ctx.state==='suspended')ctx.resume();
      try{navigator.vibrate&&navigator.vibrate(Array(60).fill(500))}catch(e){}
    }
  }
}
setInterval(tick,250); tick();

$('arm').onclick=()=>{
  const [h,m]=$('time').value.split(':').map(Number);
  if(isNaN(h))return;
  const t=new Date(); t.setHours(h,m,0,0);
  if(t<=Date.now()) t.setDate(t.getDate()+1);
  arm(t.getTime());
};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  const t=new Date(Date.now()+b.dataset.m*60000); t.setSeconds(0,0);
  if(t-Date.now()<(b.dataset.m-1)*60000) t.setMinutes(t.getMinutes()+1);
  $('time').value=fmt(t);
  arm(t.getTime());
});
$('cancel').onclick=disarm;
$('stop').onclick=disarm;
$('snooze').onclick=()=>{
  if(alarm)alarm.stop();
  $('ring').hidden=true;
  try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
  arm(Date.now()+5*60000);
};
$('test').onclick=()=>{const c=getCtx();buildAlarm(c.currentTime+0.05,1);};
</script>
</body>
</html>
